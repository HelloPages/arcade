<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d2b"><title>深潛重裝：斷層突圍</title><link rel="icon" href="assets/abyss-sub-0.svg"><link rel="stylesheet" href="abyss.css"></head>
<body><main id="app">
<header><div class="wordmark"><small>第 07 號潛航誌</small><strong>深潛重裝</strong></div><div class="readout"><span>船體 <b id="hull">—</b></span><span>連擊 <b id="combo">00</b></span><span>回收 <b id="score">00000</b></span></div><button id="pause" aria-label="暫停遊戲">暫停</button></header>
<section id="viewport" aria-label="深海戰場"><canvas id="sea" tabindex="0" aria-label="方向鍵或拖曳移動，Shift 衝刺切彈，K 深壓脈衝，P 暫停"></canvas><div id="mission" aria-live="polite"></div><div id="boss-hud" hidden><span id="boss-label">斷層守衛</span><meter id="boss-meter" max="480" value="480" aria-label="首領裝甲"></meter></div>
<section id="sheet" class="sheet"><img class="cover" src="assets/abyss-cover.svg" alt="原創版畫：銅製潛航機迎戰遺跡巨型機械守衛"><div class="sheet-copy"><p class="eyebrow">潛航作戰 / 2026.11.15</p><h1>深潛重裝<span>斷層突圍</span></h1><p>在失落的工業海床，穿越彈流，<br>以衝刺切開包圍，拆解三態守衛。</p><div class="brief"><p><b>拖曳潛航</b>　主砲自動追蹤；滑鼠可瞄準</p><p><b>衝刺切彈</b>　短暫無敵，沿途近身破甲</p><p><b>深壓脈衝</b>　清除敵彈、重創周圍敵機</p></div><label for="difficulty">作戰強度</label><select id="difficulty"><option value="cruise">巡航｜較厚裝甲、較慢敵彈</option><option value="deep">深潛｜更密集的彈幕挑戰</option></select><button id="start" class="primary">解纜下潛 <span>→</span></button><small class="keyboard">鍵盤 WASD／方向鍵移動 · Shift 衝刺 · K 脈衝 · J 主砲 · P 暫停</small><p id="best">最高回收 00000</p><a href="abyss-credits.html" target="_blank" rel="noopener">經典機制與美術來源 ↗</a></div></section>
<section id="dialog" class="dialog" hidden aria-modal="true" role="dialog" aria-labelledby="dialog-title"><p class="eyebrow">潛航紀錄</p><h2 id="dialog-title">航行暫停</h2><p id="dialog-copy"></p><div id="report"></div><button id="resume" class="primary">繼續潛航</button><button id="retry">重新出航</button><button id="home">返回船塢</button></section>
</section>
<footer><div id="helm" role="group" aria-label="方向舵，拖曳控制潛航方向"><span class="crosshair"></span><span id="knob"></span><small>方向舵</small></div><div class="weapons"><button id="fire" aria-pressed="true">主砲 <b>連射中</b></button><button id="dash">衝刺切彈 <b id="dash-state">就緒</b></button><button id="pulse">深壓脈衝 <b id="charge">100%</b></button></div><button id="fullscreen" class="standalone-only" aria-label="切換全螢幕">全螢幕</button></footer>
</main><script src="abyss-engine.js"></script><script src="abyss.js"></script></body></html>
