<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a8f3e5"><title>水豚晴旅：海島跳跳渡假</title><link rel="stylesheet" href="capybara.css"></head>
<body><header class="topbar"><a href="./">陽光遊戲館</a><button id="fullscreen">⛶ 全螢幕</button></header><button class="exit-fs-pill" id="exit-fullscreen">退出全螢幕</button>
<main id="world"><canvas id="scene" aria-label="水豚海島穿越場景"></canvas><section class="hud" aria-label="遊戲狀態"><div class="hud-line"><span class="pill" id="chapter">海風初旅 · 1 / 3</span><button class="pill" id="pause" aria-label="暫停遊戲">Ⅱ 暫停</button></div><div class="hud-line"><span class="pill">旅分 <b id="score">0</b></span><span class="pill" id="lives">愛心 3</span><span class="pill" id="timer">70 秒</span></div><div class="progress" aria-label="渡假旅程進度"><div id="progress"></div></div></section>
<div class="destination">抵達對岸 · 開啟下一段旅程</div><div id="cutin" aria-live="polite"><img id="guardian" alt="金冠鵜鶘領航員"><span><small>最後一段・金色海風</small><strong>金冠領航員登場！</strong></span></div><div id="popups" aria-hidden="true"></div>
<section class="controls"><p class="pill" id="hint">滑一下跳一格 · 水上請搭海龜</p><div class="actions"><button id="freeze"><b>海風暫停</b><small id="cooldown">凍結車輛與海龜 4 秒</small></button><div class="dpad" aria-label="方向控制"><button data-dir="up" class="up" aria-label="往上跳">↑</button><button data-dir="left" aria-label="往左跳">←</button><button data-dir="down" aria-label="往下跳">↓</button><button data-dir="right" aria-label="往右跳">→</button></div></div></section>
<section id="overlay" class="overlay"><div class="sheet"><img class="cover" src="assets/capybara_cover.jpg" alt="水豚搭乘海龜穿越陽光海灣的專屬封面"><div class="sheet-content"><span class="eyebrow">今日新旅程 · 2026.11.06</span><h1 id="heading">水豚晴旅<span>海島跳跳渡假</span></h1><p id="description">閃過海灘小貨車，搭上海龜過河。<br>三段陽光旅程，慢慢跳也很厲害。</p><p id="load-status" role="status">正在打包陽光與海風…</p><button id="start" disabled>準備旅程中…</button><small id="best">最佳旅分 0 · 滑動 / 方向鍵 / WASD</small></div></div></section>
</main><script src="capybara.js"></script></body></html>
