<!DOCTYPE html>
<html lang="zh-Hant" data-arcade-portal>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff8fb1">
  <title>撞球-2｜糖果奇幻撞球</title>
  <link rel="icon" href="./assets/cutepool-cover.webp">
  <link rel="stylesheet" href="./cutepool.css?v=20261123_cutepool_v1">
</head>
<body data-i18n-skip>
  <main id="app">
    <canvas id="stage" tabindex="0" aria-label="糖果奇幻撞球桌"></canvas>

    <!-- 頂部可愛積木計分與控制列 -->
    <header class="top-hud">
      <div class="brand-badge">
        <span class="brand-ball" aria-hidden="true">★</span>
        <div class="brand-text">
          <strong data-copy="title">糖果撞球</strong>
          <span class="ver-stamp">v_16:35</span>
        </div>
      </div>

      <div class="score-pill" aria-live="polite">
        <span id="playerScore" class="score-side active"><em data-copy="you">你</em><b>0</b></span>
        <span class="score-sep">:</span>
        <span id="cpuScore" class="score-side"><b>0</b><em>CPU</em></span>
      </div>

      <div class="top-btns">
        <button type="button" id="btnTheme" class="icon-btn" title="換桌布" aria-label="換桌布">🎨</button>
        <button type="button" id="btnBumper" class="icon-btn on" title="彈跳星機關" aria-label="彈跳星機關">⭐</button>
        <button type="button" id="btnSound" class="icon-btn" title="音效" aria-label="音效" aria-pressed="false">🔊</button>
        <button type="button" id="btnPause" class="icon-btn" title="選單" aria-label="選單">☰</button>
        <button type="button" id="btnFs" class="icon-btn" title="全螢幕" aria-label="全螢幕">⛶</button>
      </div>
    </header>

    <!-- 中央浮動提示條 -->
    <div id="statusBar" class="status-bar" role="status">點球桌瞄準，拉糖果球桿或按開球！</div>

    <!-- 底部操作列：旋球＋力道滑桿與即時數值＋出桿大按鈕 -->
    <footer class="bottom-bar">
      <button type="button" id="btnSpin" class="rect-btn spin-btn" aria-expanded="false">
        <span class="spin-icon" aria-hidden="true">⊙</span>
        <span data-copy="spin">旋球</span>
      </button>

      <label class="power-box">
        <span class="power-lbl" data-copy="power">力道</span>
        <input id="powerRange" type="range" min="12" max="100" value="80">
        <output id="powerVal" for="powerRange">80%</output>
      </label>

      <button type="button" id="btnShoot" class="rect-btn primary-btn">開球！</button>
    </footer>

    <!-- 旋球微調浮層 -->
    <section id="spinPanel" class="pop-card spin-panel" hidden>
      <div class="pop-head">
        <strong data-copy="spin">旋球擊點</strong>
        <button type="button" id="btnSpinClose" class="mini-close" aria-label="關閉">×</button>
      </div>
      <div id="spinPad" class="spin-pad" role="group" aria-label="母球擊點">
        <span id="spinDot" class="spin-dot"></span>
      </div>
      <p class="pop-hint" data-copy="spinGuide">上推跟球・下拉回帶・左右加塞</p>
      <button type="button" id="btnSpinReset" class="rect-btn" data-copy="center">置中</button>
    </section>

    <!-- 暫停／結算卡片 -->
    <div id="modalOverlay" class="modal-overlay" hidden>
      <section class="pop-card modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-badge" id="modalBadge">🍬 糖果派對</div>
        <h2 id="modalTitle">暫停休息</h2>
        <p id="modalScore" class="modal-score" hidden>4 : 2</p>
        <p id="modalStreak" class="modal-streak"></p>
        <p id="modalGuide" class="pop-hint" data-copy="guide">先進 4 球獲勝！點桌面瞄準，直接按住糖果球桿往後拉蓄力（放開或往前推桿即可出球），進袋連擊還有星光驚喜！</p>

        <div class="setting-row">
          <label for="selDiff" data-copy="opponent">CPU 難度</label>
          <select id="selDiff">
            <option value="0" data-copy="rookie">可愛初級</option>
            <option value="1" data-copy="club">活力中級</option>
            <option value="2" data-copy="pro">糖果高手</option>
          </select>
        </div>

        <div class="setting-row">
          <label for="selLang" data-copy="language">語言</label>
          <select id="selLang">
            <option value="tw">繁體中文</option>
            <option value="en">English</option>
            <option value="ko">한국어</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="button" id="btnResume" class="rect-btn primary-btn" data-copy="resume">繼續玩</button>
          <button type="button" id="btnRematch" class="rect-btn" data-copy="rematch">再來一局</button>
        </div>
      </section>
    </div>
  </main>

  <script src="./arcade-i18n.js?v=20261122_i18n_menu_v1"></script>
  <script src="./cutepool.js?v=20261123_cutepool_v1"></script>
</body>
</html>
