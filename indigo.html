<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103d76"><title>靛藍暗房：星圖顯影</title><link rel="stylesheet" href="indigo.css"><script defer src="indigo-engine.js"></script><script defer src="indigo.js"></script></head>

<header><span>藍曬研究室 ／ 第 012 號藏品</span><button id="fullscreen" hidden>全螢幕</button></header>
<section id="cover"><div class="cover-art"><img id="coverImage" src="assets/indigo-cover.webp" alt="普魯士藍藍曬天文盤與星圖底片"><span class="vertical">光留下的，都是星辰。</span></div><div class="intro"><p class="eyebrow">天文藍曬 · 十字翻燈解謎</p><h1>靛藍暗房<span>星圖顯影</span></h1><p>輕觸一格，翻轉自身與上下左右。<br>讓每片底片都顯影，拼回完整星圖。</p><label for="level">選擇底片</label><select id="level"><option value="0">01　月輪試印 · 4 × 4</option><option value="1">02　星盤校準 · 5 × 5</option><option value="2">03　深空典藏 · 5 × 5</option></select><div class="actions"><button id="start" disabled>底片載入中…</button><button id="continue" hidden disabled>繼續顯影</button></div><p id="loadMessage" role="status">無倒數・可悔步・提示不代走</p></div></section>
