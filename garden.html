<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d6f7da"><link rel="icon" href="assets/garden_cover.jpg"><title>晴空花園：花盆推推樂</title><link rel="stylesheet" href="garden.css"></head>
<body><header class="topbar"><a href="./">陽光遊戲館</a><button id="fullscreen">⛶ 全螢幕</button></header><button class="exit-fs-pill" id="exit-fullscreen">退出全螢幕</button>
<main id="world"><canvas id="scene" aria-label="晴空花園推箱子棋盤，使用方向按鈕或方向鍵移動園丁"></canvas>
<section class="hud" aria-label="遊戲狀態"><div class="hud-line"><span class="pill" id="chapter">初綻花徑 · 1 / 5</span><button class="pill" id="pause" aria-label="暫停遊戲">Ⅱ 暫停</button></div><div class="hud-line"><span class="pill">步數 <b id="moves">0</b></span><span class="pill" id="goals">花盆 0 / 1</span><span class="pill">花園分 <b id="score">0</b></span></div><div class="progress" role="progressbar" aria-label="花園完成進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress"></div></div></section>
<div id="cutin" aria-live="polite"><img id="guardian" alt="花冠蝶后"><span><small>最終花園 · 花冠蝶后</small><strong>讓整座花園一起盛開！</strong></span></div><div id="popups" aria-hidden="true"></div>
<section class="controls"><p class="pill" id="hint" role="status" aria-live="polite">將花盆推到金色花座 · 一次推一盆</p><div class="actions"><div class="tools"><button id="undo" aria-label="復原一步">↶ 復原</button><button id="help">花語提示</button><button id="restart">重來本關</button></div><div class="dpad" aria-label="方向控制"><button data-dir="up" class="up" aria-label="往上走">↑</button><button data-dir="left" aria-label="往左走">←</button><button data-dir="down" aria-label="往下走">↓</button><button data-dir="right" aria-label="往右走">→</button></div></div></section>
<section id="overlay" class="overlay"><div class="sheet"><img class="cover" src="assets/garden_cover.jpg" alt="草帽園丁將向日葵花盆推到陽光溫室花座的專屬封面"><div class="sheet-content"><span class="eyebrow">今日新花園 · 2026.11.07</span><h1 id="heading">晴空花園<span>花盆推推樂</span></h1><p id="description">把每盆向日葵推到金色花座。<br>只能推、不能拉；走錯可隨時復原。<br>五座小花園，沒有倒數，慢慢想。</p><p id="load-status" role="status">正在喚醒陽光與花香…</p><button id="start" disabled>花園準備中…</button><small id="best">最佳花園分 0 · 滑動 / 方向鍵 / WASD</small></div></div></section>
</main><script src="garden.js"></script></body></html>
