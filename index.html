      const loc = (g.i18n && (g.i18n[lang] || g.i18n.tw)) || {};
      const cleanTwTab = String(loc.shortTab || g.shortTab || g.title || g.id).replace(/[《》]/g, "").trim();
      return {
        shortTab: cleanTwTab,
        title: loc.title || g.title || cleanTwTab,
        genre: loc.genre || g.genre || "",
        reaSource: loc.reaSource || g.reaSource || "",
        highlights: loc.highlights || g.highlights || []
      };
    }

      const copy = PORTAL_COPY[lang] || PORTAL_COPY.tw;

      catalogListEl.innerHTML = catalogGames.map(g => {
        const gc = getGameCopy(g, lang);
        const thumb = g.thumbnail ? `<img class="cat-thumb" loading="lazy" decoding="async" src="${g.thumbnail}?v=${VERSION_STAMP}" alt="${gc.title}">` : "";
        const datePart = g.addedDate ? ` ｜ ${copy.addedLabel}：${g.addedDate}` : "";
        const hi = Array.isArray(gc.highlights) && gc.highlights.length ? `<br>• ${gc.highlights.join(" / ")}` : "";
        return `
          <div class="cat-item" data-stage="${g.id}">
            ${thumb}
            <div class="cat-body">
              <div class="cat-item-title">${gc.title}</div>
              <div class="cat-meta">${gc.genre}${datePart}</div>
              <div class="cat-desc">• <b>${copy.sourceLabel}</b>：${gc.reaSource}${hi}</div>
            </div>
          </div>`;
      }).join("");
      catalogListEl.querySelectorAll(".cat-item").forEach(card => {
        card.addEventListener("click", () => selectStage(card.dataset.stage));
      });

      const activeGame = catalogGames.find(g => g.id === activeStageId);
      if (activeGame) {
        const gc = getGameCopy(activeGame, lang);
        document.title = `${copy.portalName}｜${gc.shortTab}`;
        frame.title = gc.title;
      }
    }

    function selectStage(stage) {
      let target = stage;
      if (target === "2") target = "stage2";
      if (target === "3") target = "stage3";
      const game = catalogGames.find(g => g.id === target) || catalogGames[0];
      if (!game) return;
      activeStageId = game.id;
      const lang = getLang();
      const basePath = game.path || `./${game.id}.html`;
      const sep = basePath.includes("?") ? "&" : "?";
      const source = `${basePath}${sep}embed=1&lang=${lang}&v=${VERSION_STAMP}`;
      if (frame.getAttribute("src") !== source) {
        frame.src = source;
      }
      renderPortalChrome();
      const activeTab = document.getElementById(`tab-${game.id}`);
      if (activeTab) activeTab.scrollIntoView({ block: "nearest", inline: "nearest" });
      toggleCatalog(false);
      setTimeout(() => { try { frame.focus(); } catch (e) {} }, 120);
    }

    function toggleCatalog(open) {
      document.getElementById("catalogModal").classList.toggle("open", Boolean(open));
    }

    function togglePortalFullscreen(forceState) {
      const wantFs = typeof forceState === "boolean" ? forceState : !document.body.classList.contains("immersive-fs");
      document.body.classList.toggle("immersive-fs", wantFs);
      try {
        if (wantFs) {
          const el = document.documentElement;
          if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        } else {
          if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
      } catch (e) {}
      try {
        frame.contentWindow?.postMessage({ type: "PARENT_FS_STATE", value: wantFs }, "*");
      } catch (e) {}
    }

    frame.addEventListener("load", () => {
      try {
        frame.contentWindow?.postMessage({ type: "PARENT_FS_STATE", value: document.body.classList.contains("immersive-fs") }, "*");
        frame.contentWindow?.postMessage({ type: "ARCADE_SET_LANG", lang: getLang() }, "*");
      } catch (e) {}
    });

    window.addEventListener("message", (e) => {
      if (e.origin === location.origin && e.source === frame.contentWindow && e.data && e.data.type === "TOGGLE_IMMERSIVE_FS") {
        const nextVal = typeof e.data.active === "boolean" ? e.data.active : Boolean(e.data.value);
        togglePortalFullscreen(nextVal);
      }
    });

    mobileSelect.addEventListener("change", () => {
      selectStage(mobileSelect.value);
    });

    langSelect.addEventListener("change", () => {
      if (window.ArcadeI18n) {
        window.ArcadeI18n.setLang(langSelect.value, { broadcastIframe: frame });
      }
    });

    if (window.ArcadeI18n) {
      window.ArcadeI18n.onChange(() => {
        renderPortalChrome();
        try { frame.contentWindow?.postMessage({ type: "ARCADE_SET_LANG", lang: getLang() }, "*"); } catch (e) {}
      });
    }

    // 初始化先套用 URL 指定的遊戲
    const params = new URLSearchParams(location.search);
    const initialStage = params.get("stage") || location.hash.replace("#", "") || "pool";
    const startupStage = initialStage === "2" ? "stage2" : initialStage === "3" ? "stage3" : initialStage;
    if (catalogGames.some(g => g.id === startupStage)) selectStage(startupStage);

    // 載入完整 games-catalog.json（自動納入未來每日 04:00 新增的所有新作）
    fetch("./games-catalog.json?v=" + VERSION_STAMP)
      .then(r => r.json())
      .then(data => {
        if (!Array.isArray(data.games) || !data.games.length) throw new Error("Empty game catalog");
        catalogGames = data.games;
        if (!activeStageId || !catalogGames.some(g => g.id === activeStageId)) {
          selectStage(startupStage);
        } else {
          renderPortalChrome();
        }
      })
      .catch(() => { if (!activeStageId) selectStage("pool"); });
  </script>
</body>
</html>
