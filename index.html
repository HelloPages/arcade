<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<link rel="icon" href="assets/frostline-cover.webp?v=20261122_2"><title>REA遊戲館｜霜軌突圍</title>

<style>

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}

  html,body{

    width:100%;height:100%;height:100dvh;overflow:hidden;touch-action:none;

    background:#0ea5e9;color:#0f172a;

    font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei","PingFang TC",sans-serif;

  }

  #arcade-bar{

    position:fixed;top:0;left:0;right:0;height:40px;z-index:100;

    background:linear-gradient(90deg,#ffffff 0%,#e0f2fe 50%,#fef9c3 100%);

    border-bottom:2px solid #38bdf8;

    display:flex;align-items:center;justify-content:space-between;

    padding:0 6px;gap:4px;

    box-shadow:0 3px 14px rgba(2,132,199,.18);

  }

  body.immersive-fs #arcade-bar{

    display:none !important;

  }

  #exit-fs-btn{

    position:fixed;top:calc(env(safe-area-inset-top, 0px) + 8px);right:8px;z-index:9999;

    background:linear-gradient(135deg,#ec4899,#f59e0b);color:#fff;

    border:2px solid #fff;border-radius:999px;

    padding:5px 12px;font-size:11px;font-weight:900;

    cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);

    display:none;

  }

  body.immersive-fs #exit-fs-btn{

    display:inline-flex;align-items:center;gap:4px;

  }

  .brand-wrap{

    display:flex;align-items:center;gap:4px;flex-shrink:0;

  }

  .logo-badge{

    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

    font-weight:900;font-size:10px;letter-spacing:0.3px;

    color:#fff;background:linear-gradient(135deg,#0284c7,#10b981);

    border:1px solid #0ea5e9;border-radius:6px;padding:2px 6px;

    cursor:pointer;

  }

  .tabs{

    display:flex;align-items:center;gap:3px;flex:1;justify-content:flex-start;min-width:0;overflow-x:auto;

    scrollbar-width:none;

  }

  .tabs::-webkit-scrollbar{display:none;}

  .stage-tab{

    appearance:none;border:1.5px solid #bae6fd;background:#ffffff;

    color:#0369a1;border-radius:999px;padding:4px 8px;

    font-size:10.5px;font-weight:900;cursor:pointer;white-space:nowrap;

    transition:all .15s ease;display:inline-flex;align-items:center;gap:2px;flex-shrink:0;

  }

  .stage-tab.active-twinbee{

    background:linear-gradient(135deg,#0284c7,#f59e0b);

    color:#fff;border-color:#fde047;

    box-shadow:0 2px 10px rgba(245,158,11,.45);

  }

  .stage-tab.active-orchard{background:linear-gradient(135deg,#ffb842,#ed8b52);color:white;border-color:#f6a24f;}

  .stage-tab.active-pang{background:linear-gradient(135deg,#00aaba,#16a68c);color:white;border-color:#00a5b0;box-shadow:0 2px 10px #16a68c44;}

  .stage-tab.active-rainbow{

    background:linear-gradient(135deg,#f59e0b,#ec4899);

    color:#fff;border-color:#f43f5e;

    box-shadow:0 2px 10px rgba(236,72,153,.4);

  }

  .stage-tab.active-pinball{

    background:linear-gradient(135deg,#0284c7,#6366f1);

    color:#fff;border-color:#38bdf8;

    box-shadow:0 2px 10px rgba(2,132,199,.35);

  }

  .stage-tab.active-s2{

    background:linear-gradient(180deg,#0891b2,#0369a1);

    color:#fff;border-color:#67e8f9;

  }

  .stage-tab.active-s3{

    background:linear-gradient(180deg,#ea580c,#b45309);

    color:#fff;border-color:#fde047;

  }

  .right-meta{

    display:flex;align-items:center;gap:3px;flex-shrink:0;

  }

  .catalog-btn{

    appearance:none;font-size:10px;font-weight:900;

    color:#b45309;background:#fef3c7;

    border:1.5px solid #f59e0b;border-radius:999px;padding:3px 7px;white-space:nowrap;cursor:pointer;

  }

  .fs-btn{

    appearance:none;font-size:10px;font-weight:900;

    color:#ffffff;background:linear-gradient(135deg,#0ea5e9,#10b981);

    border:1.5px solid #059669;border-radius:999px;padding:3px 7px;white-space:nowrap;cursor:pointer;

  }

  .ver-pill{

    font-family:monospace;font-size:9px;font-weight:800;

    color:#047857;background:#d1fae5;

    border:1px solid #34d399;border-radius:999px;padding:2px 5px;white-space:nowrap;

  }

  #stage-viewport{

    position:fixed;top:40px;left:0;right:0;bottom:0;

    background:#e0f2fe;overflow:hidden;

  }

  body.immersive-fs #stage-viewport{

    top:0 !important;

  }

  #game-frame{

    width:100%;height:100%;border:none;display:block;background:#e0f2fe;

  }



  /* 明亮珍珠白「每日 REA 遊戲館」彈窗 */

  .catalog-modal{

    display:none;position:fixed;inset:0;z-index:500;

    background:rgba(15,23,42,.55);backdrop-filter:blur(6px);

    align-items:center;justify-content:center;padding:12px;

  }

  .catalog-modal.open{display:flex;}

  .catalog-card{

    width:100%;max-width:460px;max-height:86dvh;overflow-y:auto;

    background:linear-gradient(165deg,#ffffff,#f0f9ff);

    border:2px solid #38bdf8;border-radius:16px;padding:14px;

    box-shadow:0 12px 42px rgba(2,132,199,.35);

    color:#0f172a;

  }

  .cat-header{

    display:flex;align-items:center;justify-content:space-between;

    border-bottom:1.5px solid #bae6fd;padding-bottom:8px;margin-bottom:10px;

  }

  .cat-title{font-size:15px;font-weight:900;color:#0369a1;}

  .cat-close{

    background:linear-gradient(135deg,#ec4899,#f59e0b);color:#fff;border:none;

    border-radius:8px;padding:4px 10px;font-size:12px;font-weight:900;cursor:pointer;

  }

  .cat-item{

    display:flex;gap:10px;background:#ffffff;

    border:1.5px solid #7dd3fc;border-radius:12px;padding:9px;margin-bottom:8px;

    cursor:pointer;transition:transform .12s;

    box-shadow:0 3px 10px rgba(14,165,233,.1);

  }

  .cat-item:active{transform:scale(.98);}

  .cat-thumb{

    width:60px;height:84px;border-radius:8px;object-fit:cover;border:2px solid #f59e0b;flex-shrink:0;

  }

  .cat-body{flex:1;min-width:0;}

  .cat-item-title{font-size:13px;font-weight:900;color:#0f172a;margin-bottom:2px;}

  .cat-meta{font-size:10px;color:#059669;margin-bottom:4px;font-weight:800;}

  .cat-desc{font-size:10.5px;color:#334155;line-height:1.4;}



  @media (max-width:480px){

    #arcade-bar{padding:0 3px;gap:2px;}

    .logo-badge{font-size:8.5px;padding:2px 4px;}

    .hide-xs{display:none;}

    .stage-tab{padding:3px 6px;font-size:9.5px;}

    .catalog-btn,.fs-btn{padding:3px 5px;font-size:9px;}

    .ver-pill{display:none;}

  }

  .stage-tab.active-midnight{background:#2b2c25;color:#eee5d4;border:1px solid #8e9581;border-radius:8px;box-shadow:none;}

.stage-tab.active-lacquer{background:#451c24;color:#f4e9da;border:1px solid #96716e;border-radius:8px;box-shadow:none;}

#tab-amber{border-radius:7px}.stage-tab.active-amber{background:#7b4b28;color:#fff0cd;border:1px solid #a87a4b;box-shadow:none;}

#tab-indigo{border-radius:7px}.stage-tab.active-indigo{background:#103d76;color:#fff;border:1px solid #8aa4b8;box-shadow:none;}

#tab-fossil{border-radius:7px}.stage-tab.active-fossil{background:#344e51;color:#fff;border:1px solid #8e9c9d;box-shadow:none}#tab-weave{border-radius:7px}.stage-tab.active-weave{background:#ead5dd;color:#422a40;border:1px solid #ad839d;box-shadow:none}
#tab-shinobi{border-radius:7px}.stage-tab.active-shinobi{background:#991b1b;color:#fef3c7;border:1px solid #eab308;box-shadow:none;}
#tab-abyss{border-radius:7px}.stage-tab.active-abyss{background:#102d2b;color:#eee4c8;border:1px solid #c98050;box-shadow:none}

#tab-raiden{border-radius:7px}.stage-tab.active-raiden{background:linear-gradient(180deg,#0284c7,#0369a1);color:#fff;border:1px solid #5ce1ff}
#tab-frostline{border-radius:7px}.stage-tab.active-frostline{background:#304952;color:#e4fc8b;border:1px solid #b3d275}
#tab-solar{border-radius:7px}.stage-tab.active-solar{background:#973e2f;color:#fff4d4;border:1px solid #ffca7a}
#tab-xinan{border-radius:7px}.stage-tab.active-xinan{background:#c83e2b;color:#fff7ea;border:1px solid #e7b85c;box-shadow:none}
#tab-ridge{border-radius:7px}.stage-tab.active-ridge{background:#183ac7;color:#f3f6ed;border:1px solid #183ac7;box-shadow:none}
#tab-chime{border-radius:7px}.stage-tab.active-chime{background:#503357;color:#f3edf5;border:1px solid #503357;box-shadow:none}
#tab-moss{border-radius:7px}.stage-tab.active-moss{background:#12204c;color:#f5efd5;border:1px solid #12204c;box-shadow:none}
</style>

<link rel="stylesheet" href="visuals/portal.css?v=20261107-art1">

</head>

<body>

  <button id="exit-fs-btn" type="button" onclick="togglePortalFullscreen(false)">✕ 退出全螢幕</button>



  <header id="arcade-bar">

    <div class="brand-wrap">

      <span class="logo-badge" onclick="toggleCatalog(true)">REA<span class="hide-xs"> 遊戲館</span></span>

    </div>

    <div class="tabs" id="portal-tabs">
      <button type="button" class="stage-tab active-frostline" id="tab-frostline" onclick="selectStage('frostline')">霜軌突圍</button>
      <button type="button" class="stage-tab" id="tab-solar" onclick="selectStage('solar')">鹽原裂日</button>
      <button type="button" class="stage-tab" id="tab-raiden" onclick="selectStage('raiden')">⚡ 雷霆空域</button>
      <button type="button" class="stage-tab" id="tab-xinan" onclick="selectStage('xinan')">🏮 心安宮</button>

      <button type="button" class="stage-tab" id="tab-shinobi" onclick="selectStage('shinobi')">🥷 赤焰忍傳</button>

      <button type="button" class="stage-tab active-twinbee" id="tab-twinbee" onclick="selectStage('twinbee')">🔔 兵蜂・鈴鐺幻想</button>

      <button type="button" class="stage-tab" id="tab-rainbow" onclick="selectStage('rainbow')">🌈 彩虹泡泡龍</button>

      <button type="button" class="stage-tab" id="tab-pinball" onclick="selectStage('pinball')">🌌 太空彈珠台</button>

      <button type="button" class="stage-tab" id="tab-s3" onclick="selectStage('stage3')">☁️ 1943・亞也子</button>

      <button type="button" class="stage-tab" id="tab-s2" onclick="selectStage('stage2')">🏝️ 1943・拉包爾</button>

    </div>

    <div class="right-meta">

      <button type="button" class="catalog-btn" id="btn-catalog" onclick="toggleCatalog(true)">📚 遊戲館</button>

      <button type="button" class="fs-btn" id="standalone-link" onclick="togglePortalFullscreen()">⛶ 全螢幕</button>

      <span class="ver-pill" id="portal-version">2026.11.22</span>

    </div>

  </header>



  <main id="stage-viewport">

    <iframe id="game-frame" src="./frostline.html?embed=1&v=v_20261122_frostline_2" title="霜軌突圍" allow="autoplay; fullscreen"></iframe>

  </main>



  <div class="catalog-modal" id="catalogModal">

    <div class="catalog-card">

      <div class="cat-header">

        <div class="cat-title">REA 遊戲館・各自精彩</div>

        <button class="cat-close" type="button" onclick="toggleCatalog(false)">✕ 關閉</button>

      </div>

      <div style="font-size:11px;color:#0369a1;margin-bottom:8px;font-weight:700;">

        每一款都有自己的世界。水彩、旅行版畫、漫畫、剪紙、夜色機械與戰爭電影，依玩法建立獨立美術。每日 <b>04:00</b> 自動生成新作，<b>07:00</b> 透過 LINE 推播介紹：

      </div>

      <div id="catalogList"></div>

    </div>

  </div>



  <script>

    const VERSION_STAMP = "v_20261122_frostline_2";

    const frame = document.getElementById("game-frame");

    const tabTwinbee = document.getElementById("tab-twinbee");

    const tabRainbow = document.getElementById("tab-rainbow");

    const tabPinball = document.getElementById("tab-pinball");

    const tab2 = document.getElementById("tab-s2");

    const tab3 = document.getElementById("tab-s3");

    frame.addEventListener('load',()=>frame.contentWindow?.postMessage({type:'PARENT_FS_STATE',value:document.body.classList.contains('immersive-fs')},location.origin));



    function togglePortalFullscreen(forceState){

      const wantFs = typeof forceState === "boolean" ? forceState : !document.body.classList.contains("immersive-fs");

      document.body.classList.toggle("immersive-fs", wantFs);

      try {

        if(wantFs){

          const el = document.documentElement;

          if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});

          else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();

        } else {

          if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});

          else if(document.webkitExitFullscreen) document.webkitExitFullscreen();

        }

      } catch(e){}

      try {

        if(frame.contentWindow){

          frame.contentWindow.postMessage({ type: "PARENT_FS_STATE", value: wantFs }, "*");

        }

      } catch(e){}

    }



    window.addEventListener("message", (e) => {

      if(e.origin === location.origin && e.source === frame.contentWindow && e.data && e.data.type === "TOGGLE_IMMERSIVE_FS"){

        const nextVal = typeof e.data.active === "boolean" ? e.data.active : Boolean(e.data.value);

        togglePortalFullscreen(nextVal);

      }

    });



    function selectStage(stage){
      const tabFrostline = document.getElementById('tab-frostline');
      tabFrostline.className = 'stage-tab';
      if (stage === 'frostline') {
        document.querySelectorAll('.stage-tab').forEach(tab => tab.className = 'stage-tab');
        const source = './frostline.html?embed=1&v=' + VERSION_STAMP;
        if (frame.getAttribute('src') !== source) frame.src = source;
        frame.title = '霜軌突圍';
        tabFrostline.className = 'stage-tab active-frostline';
        tabFrostline.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        toggleCatalog(false);
        return;
      }
      const tabSolar = document.getElementById('tab-solar');
      tabSolar.className = 'stage-tab';
      if (stage === 'solar') {
        document.querySelectorAll('.stage-tab').forEach(tab => tab.className = 'stage-tab');
        const source = './solar.html?embed=1&v=' + VERSION_STAMP;
        if (frame.getAttribute('src') !== source) frame.src = source;
        frame.title = '鹽原裂日';
        tabSolar.className = 'stage-tab active-solar';
        tabSolar.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        toggleCatalog(false);
        return;
      }
      const tabRaiden = document.getElementById("tab-raiden"); if(tabRaiden) tabRaiden.className="stage-tab";
      if(stage==="raiden"){document.querySelectorAll(".stage-tab").forEach(b=>b.className="stage-tab");frame.src="./raiden.html?embed=1&v="+VERSION_STAMP;frame.title="雷霆空域：蒼穹覺醒 ULTRA";if(tabRaiden){tabRaiden.className="stage-tab active-raiden";tabRaiden.scrollIntoView({block:"nearest",inline:"nearest"});}toggleCatalog(false);setTimeout(()=>{try{frame.focus();}catch(e){}},120);return;}
      const tabXinan = document.getElementById("tab-xinan"); if(tabXinan) tabXinan.className="stage-tab";
      if(stage==="xinan"){document.querySelectorAll(".stage-tab").forEach(b=>b.className="stage-tab");frame.src="./xinan.html?embed=1&v="+VERSION_STAMP;frame.title="心安宮・三儀殿";if(tabXinan){tabXinan.className="stage-tab active-xinan";tabXinan.scrollIntoView({block:"nearest",inline:"nearest"});}toggleCatalog(false);setTimeout(()=>{try{frame.focus();}catch(e){}},120);return;}

      const tabShinobi = document.getElementById('tab-shinobi');
      if(tabShinobi) tabShinobi.className='stage-tab';
      if(stage==='shinobi'){document.querySelectorAll('.stage-tab').forEach(b=>b.className='stage-tab');frame.src='./shinobi.html?embed=1&v='+VERSION_STAMP;frame.title='赤焰忍傳：疾風手裏劍';if(tabShinobi){tabShinobi.className='stage-tab active-shinobi';tabShinobi.scrollIntoView({block:'nearest',inline:'nearest'});}toggleCatalog(false);setTimeout(()=>{try{frame.focus();}catch(e){}},120);return;}

      if(tabTwinbee) tabTwinbee.className = 'stage-tab';

      tabRainbow.className = "stage-tab";

      tabPinball.className = "stage-tab";

      tab2.className = "stage-tab";

      tab3.className = "stage-tab";

      if(stage === 'twinbee'){

        frame.src = './twinbee.html?embed=1&v=' + VERSION_STAMP;

        if(tabTwinbee) tabTwinbee.className = 'stage-tab active-twinbee';

      } else if(stage === "stage2"){

        frame.src = "./stage2.html?embed=1&v=" + VERSION_STAMP;

        tab2.className = "stage-tab active-s2";

      } else if(stage === "stage3"){

        frame.src = "./stage3.html?embed=1&v=" + VERSION_STAMP;

        tab3.className = "stage-tab active-s3";

      } else if(stage === "pinball"){

        frame.src = "./pinball.html?embed=1&v=" + VERSION_STAMP;

        tabPinball.className = "stage-tab active-pinball";

      } else if(stage === "rainbow"){

        frame.src = "./rainbow.html?embed=1&v=" + VERSION_STAMP;

        tabRainbow.className = "stage-tab active-rainbow";

      } else {

        frame.src = "./twinbee.html?embed=1&v=" + VERSION_STAMP;

        if(tabTwinbee) tabTwinbee.className = "stage-tab active-twinbee";

      }

      frame.title = stage === 'garden' ? '晴空花園：花盆推推樂' : stage === 'capybara' ? '水豚晴旅：海島跳跳渡假' : stage === 'twinbee' ? '兵蜂・晴空鈴鐺幻想曲遊戲畫面' : stage === 'orchard' ? '晴空果園遊戲畫面' : stage === 'pang' ? '晴空海島遊戲畫面' : '經典街機遊戲畫面';

      document.querySelector('.stage-tab[class*="active-"]')?.scrollIntoView({block:'nearest',inline:'nearest'});

      toggleCatalog(false);

      setTimeout(() => { try { frame.focus(); } catch(e){} }, 120);

    }



    function toggleCatalog(open){

      document.getElementById("catalogModal").classList.toggle("open", Boolean(open));

    }



    fetch("./games-catalog.json?v=" + VERSION_STAMP)

      .then(r => r.json())

      .then(data => {

        const listEl = document.getElementById("catalogList");

        if(!listEl || !Array.isArray(data.games)) return;

        listEl.innerHTML = data.games.map(g => `

          <div class="cat-item" onclick="selectStage('${g.id}')">

            <img class="cat-thumb" loading="lazy" decoding="async" src="${g.thumbnail}?v=${VERSION_STAMP}" alt="${g.title}">

            <div class="cat-body">

              <div class="cat-item-title">${g.title}</div>

              <div class="cat-meta">${g.genre} ｜ 新增日期：${g.addedDate}</div>

              <div class="cat-desc">• <b>${(g.id === 'solar' || g.id === 'frostline') ? '玩法靈感' : 'REA 逆向基底'}</b>：${g.reaSource}<br>• ${(g.highlights || []).join("；")}</div>

            </div>

          </div>

        `).join("");

      })

      .catch(() => {});



    const params = new URLSearchParams(location.search);

    const st = params.get("stage") || location.hash.replace("#", "");

    if(!st || st==='frostline'){ selectStage('frostline'); } else if(st==='solar'){ selectStage('solar'); } else if(st==='raiden'){ selectStage('raiden'); } else if(st==='shinobi'){ selectStage('shinobi'); } else if(st==='xinan'){ selectStage('xinan'); } else

    if(st === "2" || st === "stage2"){

      selectStage("stage2");

    } else if(st === "3" || st === "stage3"){

      selectStage("stage3");

    } else if(st === "pinball"){

      selectStage("pinball");

    } else if(st === "rainbow"){

      selectStage("rainbow");

    } else if(st === "twinbee"){

      selectStage("twinbee");

    } else {

      selectStage("shinobi");

    }

  </script>

</body>

</html>
