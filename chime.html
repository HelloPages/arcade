<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>鐘樓拳影：發條對決</title><link rel="icon" href="assets/chime-player-idle.svg"><link rel="stylesheet" href="chime.css"></head>
<body>
<main aria-label="鐘樓競技場"><canvas id="arena" aria-label="以搖桿移動，出拳與閃避，擊倒三階段發條守衛"></canvas>
<div id="hud" hidden><div class="health"><b>拳手／<span id="hp">12</span></b><div class="track"><i id="healthbar"></i></div><span id="score">000000</span></div><div class="boss-health"><b id="phase">守衛Ⅰ・重拳</b><div class="track"><i id="bossbar"></i></div><span id="combo">保持步伐</span></div></div>
<nav id="tools"><button id="pause" hidden aria-label="暫停">暫停</button><button id="fullscreen" aria-label="全螢幕">全螢幕</button></nav>
<div id="callout" aria-live="polite"></div>
<div id="touch" hidden><div id="stick" role="group" aria-label="移動搖桿"><span id="knob"></span><b>移動</b></div><div class="actions"><button id="burst" aria-label="破鐘，能量滿八格時可用">破鐘<span id="charge">0／8</span></button><div><button id="dodge">閃避<span>無敵翻步</span></button><button id="attack">出拳<span>按住連擊</span></button></div></div></div>
<section id="screen" class="screen"><div id="intro" class="folio"><div class="edition">第017號・鐘樓劇場</div><img class="cover" src="assets/chime-cover.webp" alt="淡紫鐘樓競技場，霧銀拳手迎戰墨紫發條守衛"><div class="intro-copy"><p class="eyebrow">近身拳鬥／自由走位</p><h1>鐘樓拳影<small>發條對決</small></h1><p class="lead">踏進鐘樓，打破守衛的節拍。</p><div class="instructions"><p><b>01</b>移動靠近・按住出拳連擊</p><p><b>02</b>紫色預警亮起・翻步閃避</p><p><b>03</b>集滿八格・破鐘清彈回復</p></div><label class="mode-label">對決節奏<select id="difficulty"><option value="stroll">初演・12格體力</option><option value="duel">壓軸・7格體力</option></select></label><button id="start" class="primary">敲響開場鐘<span>進入競技場 ↗</span></button><div class="footer-line"><span id="best">最高分000000</span><button id="sound">音效：關</button></div><details><summary>鍵盤操作與素材</summary><p>方向鍵／WASD移動，J出拳，K／空白鍵閃避，L破鐘。P／Esc暫停。手機左搖桿、右動作可雙指操作。</p><p>本作美術、角色、音效及引擎原創；最高分存於目前瀏覽器。<a href="chime-credits.html" target="_blank" rel="noopener">素材與機制來源</a></p></details></div></div>
<div id="paused" class="intermission" hidden><p class="eyebrow">鐘聲暫歇</p><h2>幕間休息</h2><p>深呼吸，再踏回節拍。</p><button id="resume" class="primary">繼續對決</button><button id="restart">重新開場</button><button id="home">回到劇場</button></div>
<div id="ending" class="intermission" hidden><p class="eyebrow" id="result-label">終幕</p><h2 id="result-title"></h2><p id="result-detail"></p><strong id="result-score"></strong><p id="result-combo"></p><button id="again" class="primary">再響一次開場鐘</button><button id="end-home">回到劇場</button></div></section>
</main><script src="chime-engine.js"></script><script src="chime.js"></script></body></html>
