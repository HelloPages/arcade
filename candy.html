<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>糖果三消-1｜台味夜市甜點派對</title>
  <link rel="preload" as="image" href="./assets/candy-bg-tw.webp?v=20261128_v3">
  <link rel="preload" as="image" href="./assets/px-tw0.webp?v=20261128_v4">
  <link rel="preload" as="image" href="./assets/px-tw1.webp?v=20261128_v4">
  <link rel="preload" as="image" href="./assets/px-tw2.webp?v=20261128_v4">
  <link rel="preload" as="image" href="./assets/px-tw3.webp?v=20261128_v4">
  <link rel="preload" as="image" href="./assets/px-tw4.webp?v=20261128_v4">
  <link rel="preload" as="image" href="./assets/px-tw5.webp?v=20261128_v4">
  <link rel="preload" as="image" href="./assets/px-bomb.webp?v=20261128_v4">
  <link rel="stylesheet" href="./candy.css?v=20261128_candy_v4">
</head>
<body>
  <canvas id="fxBackCanvas" class="fx-layer fx-back" aria-hidden="true"></canvas>

  <div id="candy-app" class="candy-app">
    <header class="hud-card" id="hudCard" aria-label="關卡資訊">
      <div class="hud-row-main" id="hudRowMain">
        <div class="level-badge">
          <span id="levelLabel">第 1 關</span>
          <span class="ver-tag" id="verTag">v_02:15</span>
        </div>
        <div class="stat-pill moves-pill" id="movesPill" aria-label="剩餘步數">
          <span class="pill-lbl" id="movesLbl">步數</span>
          <strong id="movesVal">20</strong>
        </div>
        <div class="stat-pill score-pill" aria-label="分數">
          <span class="pill-lbl" id="scoreLbl">分數</span>
          <strong id="scoreVal">0</strong>
        </div>
      </div>
      <div class="hud-row-goals" id="goalStrip" aria-label="過關目標"></div>
    </header>

    <div class="tip-banner" id="tipBanner" role="status" aria-live="polite">
      單指滑動或點兩顆相鄰台味點心，連成 3 顆就能歡樂消除！
    </div>

    <main class="board-stage" id="boardStage">
      <div class="board-frame" id="boardFrame">
        <canvas id="candyCanvas" aria-label="台味甜點三消棋盤"></canvas>
      </div>
    </main>

    <footer class="action-bar" aria-label="操作按鈕">
      <button type="button" class="act-btn hint-btn" id="btnHint"><img class="px-btn-ico" src="./assets/px-ui-hint.webp?v=20261128_v4" alt=""><span id="lblHint">提示</span></button>
      <button type="button" class="act-btn bgm-btn" id="btnBgm"><img class="px-btn-ico" src="./assets/px-ui-bgm.webp?v=20261128_v4" alt=""><span id="lblBgm">音樂</span></button>
      <button type="button" class="act-btn sound-btn" id="btnSound"><img class="px-btn-ico" src="./assets/px-ui-sfx.webp?v=20261128_v4" alt=""><span id="lblSound">音效</span></button>
      <button type="button" class="act-btn restart-btn" id="btnRestart"><img class="px-btn-ico" src="./assets/px-ui-restart.webp?v=20261128_v4" alt=""><span id="lblRestart">重玩</span></button>
      <button type="button" class="act-btn fs-btn" id="btnFs"><img class="px-btn-ico" src="./assets/px-ui-fs.webp?v=20261128_v4" alt=""><span id="lblFs">全螢幕</span></button>
    </footer>

    <div class="modal-backdrop hidden" id="resultModal" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-stars" id="modalStars"></div>
        <h2 class="modal-title" id="modalTitle">過關成功！</h2>
        <p class="modal-desc" id="modalDesc">太讚啦！剩餘步數已換算額外加分！</p>
        <div class="modal-stats" id="modalStats"></div>
        <div class="modal-actions">
          <button type="button" class="modal-btn primary" id="btnNextLevel">下一關</button>
          <button type="button" class="modal-btn secondary" id="btnRetryLevel">再玩一次</button>
        </div>
      </div>
    </div>
  </div>

  <canvas id="fxFrontCanvas" class="fx-layer fx-front" aria-hidden="true"></canvas>

  <script src="./arcade-i18n.js?v=20261122_i18n_menu_v1"></script>
  <script src="./candy.js?v=20261128_candy_v4"></script>
</body>
</html>
