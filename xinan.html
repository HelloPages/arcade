<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>心安宮・三儀殿｜打小人・祈福・問卦</title>
  <link rel="stylesheet" href="./xinan.css?v=20261123_cast9_v1">
</head>
<body>
  <div id="app">
    <canvas id="stage"></canvas>

    <!-- 頂部廟會造型狀態元件：飛簷木牌匾 LED 燈珠字 + 符籤功德牌 LED 數值 + 宮燈音效鈕 + 宮燈全螢幕鈕 -->
    <header class="top-hud">
      <div class="temple-plaque" aria-label="心安宮">
        <span class="plaque-eave" aria-hidden="true"></span>
        <span class="brand-seal">殿</span>
        <div class="plaque-led-wrap">
          <canvas id="ledBrandCanvas" class="led-brand-canvas" width="96" height="30" aria-label="心安宮"></canvas>
          <span class="sub">v_15:05:00</span>
        </div>
      </div>
      <div class="top-right-charms">
        <div class="merit-talisman" title="心安指數">
          <span class="talisman-seal">福</span>
          <canvas id="meritLedCanvas" class="merit-led-canvas" width="76" height="22" aria-label="心安指數"></canvas>
          <strong id="meritCount" class="sr-only">0</strong>
        </div>
        <div class="sound-ctrl-wrap">
          <button type="button" id="btnSound" class="bell-sound-btn" aria-label="音效開關">🔊</button>
          <button type="button" id="soundUnlockPill" class="sound-unlock-pill" aria-label="點一下開聲音">🔊 點一下開聲</button>
        </div>
        <button type="button" id="btnFs" class="bell-fs-btn" aria-label="進入全螢幕" aria-pressed="false" title="全螢幕">⛶</button>
      </div>
    </header>

    <!-- 左側直排道具快選欄（打小人／祈福／問卦道具一個一個直接點就換） -->
    <aside id="sidePropRail" class="side-prop-rail" aria-label="道具快速切換"></aside>

    <!-- 中央浮動結果 / 籤詩卡 -->
    <div id="resultCard" class="result-card hidden" role="dialog" aria-live="polite">
      <div class="result-badge" id="resultBadge">上上籤</div>
      <h2 id="resultTitle">紫氣東來・萬事順遂</h2>
      <p id="resultBody">心定則事成，今日宜放寬心懷，貴人已在不遠處。</p>
      <div class="result-sub" id="resultSub">心安 +10</div>
      <button type="button" id="btnCloseResult" class="rect-btn primary-btn">收下祝福</button>
    </div>

    <!-- 全功能集中於下方：融入廟宇紅木鎏金與暖玉質感，並附引導微動畫 -->
    <footer class="bottom-dock">
      <div class="mode-strip" id="modeStrip">
        <button type="button" class="mode-btn active" data-mode="slap">打小人</button>
        <button type="button" class="mode-btn" data-mode="bless">祈福</button>
        <button type="button" class="mode-btn" data-mode="oracle">問卦</button>
        <button type="button" class="mode-btn util-btn" id="btnScene">換景</button>
        <button type="button" class="mode-btn util-btn auto-on" id="btnAuto">自動:演</button>
      </div>
      <div class="chips-row" id="chipsRow"></div>
      <div class="action-row" id="actionRow"></div>
    </footer>
  </div>

  <script src="./arcade-i18n.js?v=20261122_i18n_menu_v1"></script>
  <script src="./xinan.js?v=20261123_cast9_v1"></script>
</body>
</html>
