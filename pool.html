<!doctype html>
<html lang="zh-Hant" data-arcade-portal>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#201711">
  <title>撞球-1</title>
  <link rel="icon" href="assets/pool-cover.webp">
  <link rel="stylesheet" href="pool.css?v=20261123">
</head>
<body data-i18n-skip>
  <main id="match">
    <canvas id="table" tabindex="0" aria-label="撞球桌"></canvas>
    <header class="scoreboard">
      <div class="wordmark"><span>6</span><b data-copy="title">撞球-1</b></div>
      <div class="score" aria-live="polite">
        <span id="player-score" class="side current"><span data-copy="you">你</span><strong>0</strong></span>
        <span id="cpu-score" class="side"><strong>0</strong><span>CPU</span></span>
      </div>
      <div class="top-actions">
        <button id="mute" type="button" aria-label="靜音" aria-pressed="false">♪</button>
        <button id="pause" type="button" aria-label="暫停">Ⅱ</button>
        <button id="fullscreen" type="button" aria-label="全螢幕">⛶</button>
      </div>
    </header>

    <div class="status" id="status" role="status">點球桌瞄準，按開球</div>
    <div class="footer">
      <button id="spin" type="button" aria-expanded="false"><span class="spin-symbol" aria-hidden="true">⊙</span><span data-copy="spin">旋球</span></button>
      <label class="power"><span data-copy="power">力道</span><input id="power" type="range" min="15" max="100" value="86"><output id="power-value">86%</output></label>
      <button id="shoot" class="primary" type="button">開球</button>
    </div>

    <section id="spin-panel" class="panel spin-panel" hidden>
      <div class="panel-heading"><strong data-copy="spin">旋球</strong><button id="spin-close" type="button" aria-label="關閉">×</button></div>
      <div id="spin-pad" tabindex="0" role="group" aria-label="母球擊點" class="spin-pad"><span id="spin-dot"></span></div>
      <p data-copy="spinGuide">上推跟球，下拉回帶，左右加塞。</p>
      <button id="spin-reset" type="button" data-copy="center">置中</button>
    </section>

    <div id="overlay" class="overlay" hidden>
      <section class="panel match-panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <div class="panel-heading"><span class="plaque">6</span><strong data-copy="title">撞球-1</strong></div>
        <h1 id="panel-title">暫停</h1>
        <p id="result-score" class="result-score" hidden></p>
        <p id="streak" class="streak"></p>
        <label class="difficulty"><span data-copy="opponent">CPU難度</span><select id="difficulty"><option value="0" data-copy="rookie">初級</option><option value="1" data-copy="club">中級</option><option value="2" data-copy="pro">高手</option></select></label>
        <p id="guide" data-copy="guide">先進4球獲勝。拖曳母球反向拉桿，或點球桌瞄準再出桿。犯規後對手可自由擺白球。</p>
        <label id="language-row" class="difficulty"><span data-copy="language">語言</span><select id="language"><option value="tw">繁體中文</option><option value="en">English</option><option value="ko">한국어</option></select></label>
        <div class="panel-actions"><button id="resume" class="primary" type="button" data-copy="resume">繼續</button><button id="rematch" type="button" data-copy="rematch">再來一局</button></div>
      </section>
    </div>
  </main>
  <script src="./arcade-i18n.js"></script>
  <script src="./pool-engine.js?v=20261123"></script>
  <script src="./pool-render.js?v=20261123"></script>
  <script src="./pool.js?v=20261123"></script>
</body>
</html>
